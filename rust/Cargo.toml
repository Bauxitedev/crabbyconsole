[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.5.1"
license = "MIT OR Apache-2.0"

# Use this to compile with release optimizations but keep debug info
# Use it like this: `cargo build --profile release-with-debug`
[profile.release-with-debug]
inherits = "release"
debug = true
incremental = true # = disabled by default for `release`. Note: do NOT enable incremental builds for the final release build - it prevents some runtime optimizations!

# Note: workspace dependencies CANNOT be optional.

[workspace.dependencies]
arc-swap = "1.9.1"
async-executor = "1.14.0"
bon = "3.9.1"
clap = { version = "4.6.1", features = ["derive", "string"] } # "string" needed so we can pass a String to PossibleValue::new()
clap_complete = { version = "4.6.5", features = ["unstable-dynamic"] }
color-eyre = "0.6.5"
csv = "1.4.0"
flume = "0.12.0"
future-timing = "0.1.0"
futures = "0.3.32"
futures-lite = "2.6.1" # modern alternative to `futures`, see https://notgull.net/futures-concurrency-in-smol/
godot = {version="0.5.5", features=["api-4-6","register-docs", "experimental-threads"]} # `experimental-threads` only needed for log_hook.rs so far
indexmap = "2.14.0"      
ordered-float = "5.3.0"
paste = "1.0.15"
rand = "=0.10.1" # fix version for determinism
rayon = "1.12.0"
scopeguard = "1.2.0"
strum = "0.28.0"
strum_macros = "0.28.0"
sysinfo = "0.39.3"
tap = "1.0.1"
time = {version = "0.3.47", features = ["macros", "local-offset", "serde", "parsing"]}
tokio = {version = "1.52.3", features=[
    "sync",
    "time",
    "macros", 
    "fs",
    "io-util",
    "net",
    "rt-multi-thread", # Warning - "rt-multi-thread" is not compatible with WASM. Use "rt" instead if you want that.
    "process" # needed to spawn processes
]}
tokio-macros = "2.7.0"
tokio-util = "0.7.18"
regex = "1.13.0"
libtest-mimic = "0.8.2" # needed for custom test harness
serde = {version="1.0.228",features = ["derive"]}
http = "1.4.2" # this can maybe be removed in the future
task-local = "0.1.1"
mini-moka = "0.10.3"
image = { version = "0.25.10", default-features = false, features = ["png"] } # we only need png support for now (saving screenshots)
thiserror = "2.0.18"
inventory = "0.3.24"
num-traits = "0.2.19"
plotters = { version = "0.3.7", default-features = false, features = [
    "bitmap_backend",
    "line_series",
    "histogram",
    # "ttf", # slow
    "ab_glyph", # uses a pure-rust font renderer, much faster
] }
criterion = "0.8.2"
serde_json = "1.0.149"
tracing = "0.1.44"
tracing-error = "0.2.1"
tracing-subscriber = {version="0.3.23", features = [
    "env-filter",
    "time",
    "local-time",
]}
tracing-tracy = { version = "0.11.4", features = ["only-localhost", "demangle", "ondemand", "manual-lifetime"] } 
# `ondemand` = start collecting traces only when a server connects to the client (prevents ram explosion if no server runs for a long time) 
# Note:  `flush-on-exit` works only if the game is running outside the editor.
# Maybe use `manual-lifetime` so you can unload the client in dtor.
# Note: "debuginfod" causes build failure with vague error.
# Note: "flush-on-exit" must NOT be set, otherwise you get ghost processes every time you quit godot without connecting tracy to it.
# Note: "manual-lifetime" implies "delayed-init".